[project]
name = "openharness"
version = "0.2.0"
description = "AI agent harness — workspace + runtime for a Chief of Staff and the AI employees they run."
authors = [{name = "Claude Code (Chief of Staff for John Husband)"}]
requires-python = ">=3.10"
dependencies = []
license = {text = "MIT"}

[project.scripts]
harness = "openharness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
